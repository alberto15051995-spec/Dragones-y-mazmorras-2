<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D&D 5e">
<title>⚔️ D&D 5e Multijugador</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
:root {
  --gold:#c9a84c; --gold2:#e8c870; --gold-dim:#7a6430;
  --blood:#c0392b; --bg:#07060e; --bg2:#0c0b18; --bg3:#131222; --bg4:#1a1830;
  --border:#1e1c38; --border2:#2d2b50;
  --text:#d4c8a8; --text2:#9a8e74; --text3:#5a5040; --parchment:#ede0c4;
  --hp:#e05050; --mp:#5090e0; --xp:#c9a84c; --green:#4caf50;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'IM Fell English',Georgia,serif;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{text-shadow:0 0 16px #c9a84c44}50%{text-shadow:0 0 32px #c9a84caa}}
@keyframes shimmer{0%{background-position:-300% center}100%{background-position:300% center}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes popIn{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rollDice{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes onlinePulse{0%,100%{box-shadow:0 0 0 0 #4caf5066}50%{box-shadow:0 0 0 6px #4caf5000}}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
.screen{display:none;flex-direction:column;height:100%;animation:fadeIn .35s ease;overflow:hidden;}
.screen.active{display:flex;}

/* ── MENU ── */
#screen-menu{background:radial-gradient(ellipse at 50% -10%,#1a0a3a 0%,#07060e 55%);align-items:center;justify-content:center;position:relative;overflow:hidden;}
.menu-content{position:relative;z-index:2;text-align:center;padding:24px 20px;width:100%;max-width:380px;}
.menu-dragon{font-size:72px;display:block;margin-bottom:12px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 24px #c9a84c55);}
.menu-title{font-family:'Cinzel Decorative',serif;font-size:clamp(26px,8vw,44px);background:linear-gradient(135deg,#8a6020,#f0c060,#c9a84c,#f0d080,#8a6020);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 5s linear infinite;letter-spacing:4px;line-height:1.1;}
.menu-amp{color:var(--gold-dim);font-family:'Cinzel',serif;font-size:14px;letter-spacing:10px;display:block;margin:6px 0;}
.menu-sub{color:var(--text2);font-style:italic;font-size:13px;margin:12px 0 28px;line-height:1.5;}
.btn{position:relative;overflow:hidden;cursor:pointer;user-select:none;}
.btn::after{content:'';position:absolute;inset:0;background:white;opacity:0;border-radius:inherit;transition:opacity .15s;}
.btn:active::after{opacity:.08;}
.btn-gold{display:block;width:100%;padding:16px 20px;margin-bottom:12px;background:linear-gradient(135deg,#1c0a00,#3d1c00);border:1px solid var(--gold);border-radius:6px;font-family:'Cinzel',serif;font-size:14px;letter-spacing:3px;color:var(--gold);box-shadow:0 0 24px #c9a84c18;}
.btn-ghost{display:block;width:100%;padding:14px 20px;margin-bottom:10px;background:transparent;border:1px solid var(--border2);border-radius:6px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px;color:var(--text2);}

/* ── LOBBY ── */
#screen-lobby{background:var(--bg);}
.lobby-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;padding-top:calc(14px + env(safe-area-inset-top,0px));}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:16px;cursor:pointer;flex-shrink:0;}
.lobby-title{font-family:'Cinzel',serif;color:var(--gold);font-size:15px;letter-spacing:2px;}
.lobby-body{flex:1;overflow-y:auto;padding:16px;}
.room-code-display{background:var(--bg3);border:2px solid var(--gold);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px;animation:popIn .4s ease;}
.room-code-label{font-family:'Cinzel',serif;color:var(--text2);font-size:10px;letter-spacing:3px;margin-bottom:8px;}
.room-code-value{font-family:'Cinzel Decorative',serif;font-size:40px;color:var(--gold);letter-spacing:8px;}
.room-code-hint{color:var(--text3);font-size:11px;margin-top:8px;font-style:italic;}
.players-waiting{margin-top:16px;}
.waiting-title{font-family:'Cinzel',serif;color:var(--text2);font-size:10px;letter-spacing:3px;margin-bottom:10px;}
.player-waiting-card{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:8px;animation:slideDown .3s ease;}
.player-dot-online{width:10px;height:10px;border-radius:50%;background:var(--green);animation:onlinePulse 2s infinite;flex-shrink:0;}
.player-dot-offline{width:10px;height:10px;border-radius:50%;background:var(--border2);flex-shrink:0;}
.join-form{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:16px;margin-bottom:16px;}
.join-form-title{font-family:'Cinzel',serif;color:var(--gold);font-size:12px;letter-spacing:2px;margin-bottom:12px;}
.input{width:100%;padding:13px 14px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'IM Fell English',serif;font-size:15px;outline:none;transition:border .2s;-webkit-appearance:none;margin-bottom:8px;}
.input:focus{border-color:var(--gold-dim);}
.lobby-footer{padding:14px 16px;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:calc(14px + var(--safe));flex-shrink:0;}

/* ── CREATE CHARACTER ── */
#screen-create{background:var(--bg);}
.create-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;padding-top:calc(14px + env(safe-area-inset-top,0px));}
.create-steps{display:flex;padding:10px 16px;gap:6px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.step-dot{flex:1;height:3px;border-radius:2px;background:var(--border2);transition:background .3s;}
.step-dot.done{background:var(--gold-dim);}.step-dot.active{background:var(--gold);}
.create-body{flex:1;overflow-y:auto;padding:20px 16px;}
.create-footer{padding:14px 16px;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:calc(14px + var(--safe));flex-shrink:0;}
.step-page{display:none;animation:fadeUp .3s ease;}.step-page.active{display:block;}
.step-title{font-family:'Cinzel',serif;color:var(--gold);font-size:17px;letter-spacing:2px;margin-bottom:4px;}
.step-hint{color:var(--text2);font-size:12px;font-style:italic;margin-bottom:16px;line-height:1.5;}
.label{font-family:'Cinzel',serif;color:var(--text3);font-size:9px;letter-spacing:3px;display:block;margin-bottom:6px;margin-top:14px;}
textarea.input{resize:none;min-height:80px;}
.race-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.race-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.race-card:active{transform:scale(.95);}.race-card.sel{border-color:var(--gold);background:var(--bg4);}
.race-emoji{font-size:26px;}.race-name{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.5px;color:var(--text2);}
.race-card.sel .race-name{color:var(--gold);}
.class-list{display:flex;flex-direction:column;gap:8px;}
.class-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:14px;}
.class-card:active{transform:scale(.98);}.class-card.sel{border-color:var(--gold);background:var(--bg4);}
.class-card-icon{font-size:32px;flex-shrink:0;}.class-card-name{font-family:'Cinzel',serif;color:var(--text);font-size:14px;letter-spacing:1px;}
.class-card.sel .class-card-name{color:var(--gold);}.class-card-desc{color:var(--text2);font-size:12px;margin-top:2px;font-style:italic;}
.class-card-stats{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.cs-chip{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text2);font-family:'Cinzel',serif;}
.attr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.attr-box{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;}
.attr-box:active{transform:scale(.95);border-color:var(--gold);}
.attr-lbl{font-family:'Cinzel',serif;font-size:9px;color:var(--text3);letter-spacing:1px;}
.attr-val{font-family:'Cinzel Decorative',serif;font-size:28px;color:var(--gold);line-height:1;margin:4px 0;}
.attr-mod{font-size:12px;color:var(--text2);}
.reroll-all{width:100%;padding:12px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer;text-align:center;}
.align-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.align-btn{padding:11px 4px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;text-align:center;font-size:11px;font-family:'IM Fell English',serif;line-height:1.3;}
.align-btn.sel{border-color:var(--gold);background:var(--bg4);color:var(--gold);}

/* ── GAME ── */
#screen-game{background:var(--bg);}
#game-hud{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:calc(10px + env(safe-area-inset-top,0px));}
.hud-avatar{font-size:26px;flex-shrink:0;}
.hud-info{flex:1;min-width:0;}
.hud-name{font-family:'Cinzel',serif;color:var(--gold);font-size:13px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hud-sub{color:var(--text2);font-size:10px;font-style:italic;}
.hud-bars{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
.mini-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.mini-fill{height:100%;border-radius:3px;transition:width .4s ease;}
.hud-btn{width:34px;height:34px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;}
.hud-btn:active{background:var(--bg4);border-color:var(--gold-dim);}

/* Players strip */
#players-strip{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#players-strip::-webkit-scrollbar{display:none;}
.player-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);white-space:nowrap;flex-shrink:0;}
.player-chip.me{border-color:var(--gold);}
.chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.chip-name{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1px;color:var(--text2);}
.chip-hp{font-size:9px;color:var(--hp);}

#messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}

/* Message types */
.msg-dm{background:linear-gradient(135deg,#0c0a1e,#10101e);border:1px solid var(--border2);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:13px 14px;animation:slideDown .3s ease;}
.msg-dm-header{font-family:'Cinzel',serif;color:var(--gold);font-size:9px;letter-spacing:2px;margin-bottom:8px;}
.msg-dm-text{color:var(--parchment);font-size:14px;line-height:1.75;white-space:pre-wrap;}
.msg-player{border:1px solid;border-radius:12px 0 0 12px;padding:10px 13px;margin-left:20px;animation:slideUp .25s ease;}
.msg-player-header{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;margin-bottom:5px;}
.msg-player-text{font-size:14px;line-height:1.6;}
.msg-system{text-align:center;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;color:var(--text3);font-style:italic;}
.msg-roll{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;}
.roll-who{font-family:'Cinzel',serif;font-size:10px;color:var(--text2);letter-spacing:1px;}
.roll-number{font-family:'Cinzel Decorative',serif;font-size:28px;color:var(--gold);margin-left:auto;}
.roll-crit{color:#ffd700!important;animation:glow .8s ease;}
.roll-fail{color:var(--blood)!important;}
.typing-bubble{display:inline-flex;gap:5px;padding:12px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:0 12px 12px 0;border-left:3px solid var(--gold-dim);}
.t-dot{width:6px;height:6px;border-radius:50%;background:var(--gold-dim);animation:pulse 1.2s infinite;}
.t-dot:nth-child(2){animation-delay:.2s}.t-dot:nth-child(3){animation-delay:.4s}

#options-bar{padding:8px 14px;border-top:1px solid var(--border);background:var(--bg2);overflow-x:auto;display:flex;gap:8px;flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#options-bar::-webkit-scrollbar{display:none;}
.opt-chip{white-space:nowrap;padding:9px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;color:var(--text2);cursor:pointer;font-family:'IM Fell English',serif;font-size:13px;flex-shrink:0;}
.opt-chip:active{border-color:var(--gold);color:var(--gold);transform:scale(.96);}

#input-bar{background:var(--bg2);border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;padding-bottom:calc(10px + var(--safe));}
#game-input{flex:1;min-height:42px;max-height:100px;padding:11px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;color:var(--text);font-family:'IM Fell English',serif;font-size:15px;resize:none;outline:none;transition:border .2s;line-height:1.4;}
#game-input:focus{border-color:var(--gold-dim);}
.send-btn{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#1c0a00,#3d1c00);border:1px solid var(--gold);color:var(--gold);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.send-btn:active{transform:scale(.92);}

#nav-tabs{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:var(--safe);flex-shrink:0;}
.nav-tab{flex:1;padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.nav-tab-icon{font-size:20px;}.nav-tab-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:1px;color:var(--text3);}
.nav-tab.active .nav-tab-lbl{color:var(--gold);}
.nav-tab:active{transform:scale(.93);}

/* Bottom sheets */
.sheet-overlay{display:none;position:fixed;inset:0;background:#000000cc;z-index:50;backdrop-filter:blur(3px);}
.sheet-overlay.open{display:flex;align-items:flex-end;animation:fadeIn .2s ease;}
.bottom-sheet{width:100%;max-height:80vh;background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid var(--border2);display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s cubic-bezier(.2,.8,.3,1);padding-bottom:var(--safe);}
.sheet-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 4px;}
.sheet-title{font-family:'Cinzel',serif;color:var(--gold);font-size:13px;letter-spacing:2px;text-align:center;padding:6px 16px 14px;}
.sheet-body{flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;}
.stat-row{margin-bottom:12px;}
.stat-top{display:flex;justify-content:space-between;font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;margin-bottom:4px;}
.stat-bg{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.stat-fill{height:100%;border-radius:4px;transition:width .5s ease;}
.hp-fill{background:linear-gradient(90deg,#7b0000,#c0392b);}
.mp-fill{background:linear-gradient(90deg,#1a3a7a,#3a7ac0);}
.xp-fill{background:linear-gradient(90deg,#7a6000,#c9a84c);}
.attr-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.attr-mini{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 4px;text-align:center;}
.am-lbl{font-family:'Cinzel',serif;font-size:8px;color:var(--text3);letter-spacing:1px;}
.am-val{font-family:'Cinzel',serif;font-size:18px;color:var(--gold);}
.am-mod{font-size:10px;color:var(--text2);}
.dice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.die-btn{padding:14px 4px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text2);cursor:pointer;text-align:center;font-family:'Cinzel',serif;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.die-btn:active{transform:scale(.93);border-color:var(--gold);color:var(--gold);}
.die-btn.sel{border-color:var(--gold);background:var(--bg4);color:var(--gold);}
.die-icon{font-size:20px;}.die-name{font-size:9px;}
.dice-roll-btn{width:100%;padding:15px;background:linear-gradient(135deg,#1c0a00,#3d1c00);border:1px solid var(--gold);border-radius:10px;cursor:pointer;font-family:'Cinzel',serif;font-size:14px;letter-spacing:3px;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:8px;}
.dice-roll-btn:active{transform:scale(.97);}
.dice-result{text-align:center;margin-top:14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dice-big{font-family:'Cinzel Decorative',serif;font-size:52px;color:var(--gold);animation:popIn .3s ease;}
.dice-sub{font-family:'Cinzel',serif;font-size:11px;color:var(--text2);margin-top:2px;}
.qty-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;justify-content:center;}
.qty-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.qty-val{font-family:'Cinzel',serif;font-size:18px;color:var(--gold);min-width:30px;text-align:center;}
.inv-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.inv-name{flex:1;color:var(--text);font-size:14px;}
.inv-use{padding:6px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;cursor:pointer;}
.inv-use:active{border-color:var(--green);color:var(--green);}

/* Combat sheet */
.combatant-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(-
